[package]
name = "zproxy"
version = "0.1.0"
description = "ZProxy — Local HTTP/HTTPS Request Inspector"
authors = ["TheHolyOneZ"]
edition = "2021"

[lib]
name = "zproxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }

hudsucker = { version = "0.21", features = ["rustls-client"] }
rcgen = "0.11"
async-trait = "0.1"
http = "0.2"

dashmap = "6"
bytes = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
